    function renderEvents(list) {
        const container = document.getElementById('events');
        container.innerHTML = list.slice(0, 300).map(e => `
            <div class="event">
                <div class="event-date">${e.date}</div>
                <div class="event-desc">${e.event}</div>
                <div class="event-meta">
                    ${e.participants.length ? `Participants: ${e.participants.join(', ')}` : ''}
                    ${e.source ? `| Source: ${e.source}` : ''}
                </div>
            </div>
        `).join('');
    }

    function filterEvents() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = events.filter(e =>
            e.date.toLowerCase().includes(query) ||
            e.event.toLowerCase().includes(query) ||
            e.participants.some(p => p.toLowerCase().includes(query))
        );
        renderEvents(filtered);
    }

    renderEvents(events);
    </script>
</body>
</html>
