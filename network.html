aily News", "types": ["CO_MENTIONED"], "weight": 2}, {"source": "St. Thomas", "target": "Virgin Islands", "types": ["CO_MENTIONED"], "weight": 2}, {"source": "St. Thomas", "target": "Virgin Islands Daily News", "types": ["CO_MENTIONED"], "weight": 2}];

    // State
    let activeFilters = { person: true, organization: true, location: true };
    let selectedNode = null;
    let hoveredNode = null;
    let currentMode = 'focused'; // 'focused' or 'full'

    // Sort nodes by count for focused mode
    const sortedNodes = [...allNodes].sort((a, b) => b.count - a.count);

    // Get visible data based on filters and mode
    function getFilteredData() {
        // Apply mode limit first
        let baseNodes = currentMode === 'focused'
            ? sortedNodes.slice(0, 150)  // Top 150 for focused mode
            : allNodes;                   // All 800 for full mode

        // Then apply type filters
        const nodes = baseNodes.filter(n => activeFilters[n.type]);
        const nodeIds = new Set(nodes.map(n => n.id));
        const links = allLinks.filter(l => nodeIds.has(l.source.id || l.source) && nodeIds.has(l.target.id || l.target));
        return { nodes, links };
    }

    // Mode toggle
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('mode-focused').classList.toggle('active', mode === 'focused');
        document.getElementById('mode-full').classList.toggle('active', mode === 'full');
        render();
    }

    // Color by type
    const typeColors = {
        person: '#e94560',
        organization: '#3498db',
        location: '#2ecc71'
    };

    // Setup
    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select('#graph')
        .append('svg')
        .attr('width', width)
        .attr('height', height);

    const g = svg.append('g');

    // Zoom
    const zoom = d3.zoom()
        .extent([[0, 0], [width, height]])
        .scaleExtent([0.1, 8])
        .on('zoom', (event) => g.attr('transform', event.transform));

    svg.call(zoom);

    // Arrow marker for directed edges
    svg.append('defs').append('marker')
        .attr('id', 'arrowhead')
        .attr('viewBox', '-0 -5 10 10')
        .attr('refX', 20)
        .attr('refY', 0)
        .attr('orient', 'auto')
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .append('path')
        .attr('d', 'M 0,-5 L 10,0 L 0,5')
        .attr('fill', '#555');

    // Link group
    const linkGroup = g.append('g').attr('class', 'links');

    // Node group
    const nodeGroup = g.append('g').attr('class', 'nodes');

    // Simulation
    const simulation = d3.forceSimulation()
        .force('link', d3.forceLink().id(d => d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(d => getRadius(d) + 5))
        .force('x', d3.forceX(width / 2).strength(0.05))
        .force('y', d3.forceY(height / 2).strength(0.05));

    function getRadius(d) {
        return Math.min(Math.max(Math.log(d.count + 1) * 4, 5), 30);
    }

    // Tooltip
    const tooltip = d3.select('#tooltip');

    // Render graph
    function render() {
        const data = getFilteredData();

        // Update stats
        document.getElementById('visible-stats').textContent =
            `${data.nodes.length} nodes · ${data.links.length} edges`;

        // Links
        const link = linkGroup.selectAll('line')
            .data(data.links, d => `${d.source.id || d.source}-${d.target.id || d.target}`);

        link.exit().remove();

        const linkEnter = link.enter()
            .append('line')
            .attr('class', 'link')
            .attr('stroke-width', d => Math.min(Math.sqrt(d.weight), 4));

        const linkMerge = linkEnter.merge(link);

        // Nodes
        const node = nodeGroup.selectAll('g.node')
            .data(data.nodes, d => d.id);

        node.exit().remove();

        const nodeEnter = node.enter()
            .append('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        nodeEnter.append('circle')
            .attr('r', d => getRadius(d))
            .attr('fill', d => typeColors[d.type])
            .attr('stroke', '#fff')
            .attr('stroke-width', 1);

        nodeEnter.append('text')
            .text(d => d.id.length > 20 ? d.id.slice(0, 20) + '...' : d.id)
            .attr('x', d => getRadius(d) + 4)
            .attr('y', 4);

        const nodeMerge = nodeEnter.merge(node);

        // Events
        nodeMerge
            .on('mouseover', handleMouseOver)
            .on('mouseout', handleMouseOut)
            .on('click', handleClick)
            .on('dblclick', handleDoubleClick);

        // Update simulation
        simulation.nodes(data.nodes);
        simulation.force('link').links(data.links);
        simulation.alpha(0.5).restart();

        simulation.on('tick', () => {
            linkMerge
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            nodeMerge.attr('transform', d => `translate(${d.x},${d.y})`);
        });
    }

    // Mouse handlers
    function handleMouseOver(event, d) {
        hoveredNode = d;

        // Highlight connected
        const connectedIds = new Set();
        connectedIds.add(d.id);

        linkGroup.selectAll('line').each(function(l) {
            const sourceId = l.source.id || l.source;
            const targetId = l.target.id || l.target;
            if (sourceId === d.id) connectedIds.add(targetId);
            if (targetId === d.id) connectedIds.add(sourceId);
        });

        nodeGroup.selectAll('g.node')
            .classed('dimmed', n => !connectedIds.has(n.id))
            .classed('highlighted', n => n.id === d.id);

        linkGroup.selectAll('line')
            .classed('highlighted', l => (l.source.id || l.source) === d.id || (l.target.id || l.target) === d.id);

        // Tooltip
        tooltip.style('display', 'block')
            .style('left', (event.clientX + 15) + 'px')
            .style('top', (event.clientY + 15) + 'px')
            .html(`<strong>${d.id}</strong><span class="type-badge ${d.type}">${d.type}</span><br>
                   <span style="color:#888">Mentions:</span> ${d.count.toLocaleString()}<br>
                   <span style="color:#888">Connections:</span> ${connectedIds.size - 1}`);
    }

    function handleMouseOut() {
        hoveredNode = null;
        nodeGroup.selectAll('g.node').classed('dimmed', false).classed('highlighted', false);
        linkGroup.selectAll('line').classed('highlighted', false);
        tooltip.style('display', 'none');
    }

    function handleClick(event, d) {
        event.stopPropagation();
        selectedNode = d;
        showDetail(d);
    }

    function handleDoubleClick(event, d) {
        event.stopPropagation();
        // Zoom to node
        const scale = 2;
        const x = width / 2 - d.x * scale;
        const y = height / 2 - d.y * scale;
        svg.transition().duration(500)
            .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
    }

    // Detail panel
    function showDetail(d) {
        const panel = document.getElementById('detail-panel');
        panel.classList.add('open');

        document.getElementById('detail-name').textContent = d.id;
        document.getElementById('detail-type').innerHTML = `<span class="type-badge ${d.type}">${d.type}</span>`;
        document.getElementById('detail-count').textContent = `${d.count.toLocaleString()} mentions`;

        // Roles
        const rolesHtml = d.roles && d.roles.length
            ? d.roles.map(r => `<div style="color:#aaa;padding:3px 0;">• ${r}</div>`).join('')
            : '<div style="color:#666;">No roles recorded</div>';
        document.getElementById('detail-roles').innerHTML = rolesHtml;

        // Find connections
        const connections = [];
        allLinks.forEach(l => {
            const sourceId = l.source.id || l.source;
            const targetId = l.target.id || l.target;
            if (sourceId === d.id) {
                const target = allNodes.find(n => n.id === targetId);
                if (target) connections.push({ node: target, types: l.types });
            }
            if (targetId === d.id) {
                const source = allNodes.find(n => n.id === sourceId);
                if (source) connections.push({ node: source, types: l.types });
            }
        });

        document.getElementById('detail-conn-count').textContent = connections.length;

        const connHtml = connections.slice(0, 30).map(c =>
            `<div class="connection-item" onclick="focusNode('${c.node.id.replace(/'/g, "\\'")}')">
                <span style="color:${typeColors[c.node.type]}">●</span> ${c.node.id}
                <div style="font-size:10px;color:#666;">${c.types.join(', ')}</div>
            </div>`
        ).join('');
        document.getElementById('detail-connections').innerHTML = connHtml || '<div style="color:#666;">No connections</div>';

        // Sources
        const srcHtml = d.sources && d.sources.length
            ? d.sources.map(s => `<div style="color:#888;padding:3px 0;font-size:11px;">📄 ${s}</div>`).join('')
            : '<div style="color:#666;">No sources</div>';
        document.getElementById('detail-sources').innerHTML = srcHtml;
    }

    function closeDetail() {
        document.getElementById('detail-panel').classList.remove('open');
        selectedNode = null;
    }

    function focusNode(id) {
        const node = allNodes.find(n => n.id === id);
        if (node && node.x && node.y) {
            const scale = 2;
            const x = width / 2 - node.x * scale;
            const y = height / 2 - node.y * scale;
            svg.transition().duration(500)
                .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
            showDetail(node);
        }
    }

    // Filter toggle
    function toggleFilter(type) {
        activeFilters[type] = !activeFilters[type];
        const btn = document.querySelector(`.filter-btn.${type}`);
        btn.classList.toggle('active');
        render();
    }

    // Search
    function handleSearch() {
        const query = document.getElementById('search').value.toLowerCase();
        if (!query) {
            nodeGroup.selectAll('g.node').classed('dimmed', false).classed('highlighted', false);
            return;
        }

        nodeGroup.selectAll('g.node')
            .classed('dimmed', d => !d.id.toLowerCase().includes(query))
            .classed('highlighted', d => d.id.toLowerCase().includes(query));
    }

    function showAutocomplete() {
        const query = document.getElementById('search').value.toLowerCase();
        if (!query || query.length < 2) return;

        const matches = allNodes.filter(n => n.id.toLowerCase().includes(query)).slice(0, 8);
        const ac = document.getElementById('autocomplete');

        if (matches.length) {
            ac.innerHTML = matches.map(m =>
                `<div class="autocomplete-item" onmousedown="selectAutocomplete('${m.id.replace(/'/g, "\\'")}')">${m.id}</div>`
            ).join('');
            ac.style.display = 'block';
        } else {
            ac.style.display = 'none';
        }
    }

    function hideAutocomplete() {
        setTimeout(() => document.getElementById('autocomplete').style.display = 'none', 200);
    }

    function selectAutocomplete(id) {
        document.getElementById('search').value = id;
        document.getElementById('autocomplete').style.display = 'none';

        const node = allNodes.find(n => n.id === id);
        if (node) {
            focusNode(id);
        }
    }

    // Drag handlers
    function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
    }

    function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
    }

    function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
    }

    // Close panel on background click
    svg.on('click', () => closeDetail());

    // Initial render
    render();
    </script>
